.build_base:
  stage: build
  variables:
    CC: ""
    CXX: ""
    FC: ""

    buildShared: "ON"
    buildStatic: "OFF"
    # Default value, can be set to "Debug" on a per-stage basis
    cmakeBuildType: "Release"

    archFullName: ${Arch}-${Platform}-${OS}-${ToolsSpec}-${CompilerSuite}-${ParallelType}
    archInstallDir: ${BASE_INSTALL_DIR}/${archFullName}
    ssInstallDir: ${archInstallDir}/SuiteSparse/${SuiteSparseVersion}
    admsInstallDir: ${archInstallDir}/ADMS/${ADMSVersion}
    trilinosInstallDir: ${archInstallDir}/trilinos/${TrilinosVersion}
    xyceInstallDir: ${archInstallDir}/xyce/${XYCE_INSTALL_STRING}
  before_script:
    # exit immediately when an error happens
    - set -e
    - myLoginID=$(whoami)
    - export PATH="/projects/xyce/flexbison/bin:${PATH}"
    # protect against running as anyone other than xyce-jenkins
    - |
      if [[ "${myLoginID}" != "xyce-jenkins" ]]; then
        echo "Error: Unauthorized user: ${myLoginID}"
        echo "Only user authorized to run this pipeline is: xyce-jenkins"
        exit 1
      else
        echo "Running as user: ${myLoginID}"
      fi
    # directory where xyce repos will be cloned, including another
    # copy of the "Xyce" repo itself
    - rm -rf ${CI_PROJECT_DIR}/repos || true
    - mkdir -p ${CI_PROJECT_DIR}/repos
    # load modules for build
    - |
      module purge
      for mod in ${CommonModules} ${MyModules}; do
        module add "${mod}" || { echo "Error: Failed to add module ${mod}"; exit 1; }
      done
    - module list
    - export CXX=${MyCXX}
    - export CC=${MyCC}
    - export FC=${MyFC}
    # generate branch names for use in cloning repos
    - |
      for b in ${BranchList}; do
        var="${b}Branch"
        if [[ -z "${!var}" ]]; then
          declare "${var}=${DEFAULT_BRANCH}"
        fi
      done
    - echo "DEFAULT_BRANCH = ${DEFAULT_BRANCH}"
    - echo "XyceBranch = ${XyceBranch}"
    - echo "XyceFTRegressionBranch = ${XyceFTRegressionBranch}"
    - echo "XyceRegressionBranch = ${XyceRegressionBranch}"
    - echo "XyceNonFreeBranch = ${XyceNonFreeBranch}"
    - echo "XyceSandiaModelsBranch = ${XyceSandiaModelsBranch}"
    - echo "XyceSandiaRegressionBranch= ${XyceSandiaRegressionBranch}"
    - echo "CI_PIPELINE_SOURCE = ${CI_PIPELINE_SOURCE}"
    - |
      if [[ "${buildShared}" == "OFF" ]]; then
        libTypeStr="static"
      else
        libTypeStr="dynamic"
      fi
    - |
      if [[ "${cmakeBuildType}" == "Release" ]]; then
        optStr="opt"
      else
        optStr="dbg"
      fi
    # define some shell functions, cleanInstallDir() and cloneAllXyceRepos() that
    # can be used throughout the build process
    - |
      cleanInstallDir() {
        local installDir="$1"
        if [ -d "${installDir}" ]; then
          echo "cleaning ${installDir}"
          cd "$(dirname ${installDir})"
          rm -rf "$(basename ${installDir})"
        else
          echo "creating install directory: ${installDir}"
          mkdir -p "${installDir}"
        fi
      }
    - |
      cloneAllXyceRepos() {
        cloneRepo() {
          local branch="$1"
          local repoName="$2"
          local cloneToDir="$3"
          git clone --branch ${branch} git@cee-gitlab.sandia.gov:${repoName} ${cloneToDir} || { echo "Error: Failed to clone ${repoName} branch ${branch} to ${cloneToDir}"; exit 1; }
        }
        # clone all relevant repositories
        cloneRepo "${XyceBranch}" "${mainXyceRepo}" "${CI_PROJECT_DIR}/repos/Xyce"
        cloneRepo "${XyceSandiaModelsBranch}" "Xyce/code/ouo-exp/Xyce_SandiaModels.git" "${CI_PROJECT_DIR}/repos/Xyce/src/DeviceModelPKG/SandiaModels"
        cloneRepo "${XyceNonFreeBranch}" "Xyce/code/uur-proprietary/Xyce_NonFree.git" "${CI_PROJECT_DIR}/repos/Xyce/src/DeviceModelPKG/Xyce_NonFree"
        cloneRepo "${XyceRegressionBranch}" "Xyce/code/uur-proprietary/Xyce_Regression.git" "${CI_PROJECT_DIR}/repos/Xyce/Xyce_Regression"
        cloneRepo "${XyceSandiaRegressionBranch}" "Xyce/code/ouo-exp/Xyce_SandiaRegression.git" "${CI_PROJECT_DIR}/repos/Xyce/Xyce_Regression/Xyce_SandiaRegression"
        cloneRepo "${XyceFTRegressionBranch}" "Xyce/code/uur-proprietary/Xyce_FastrackRegression.git" "${CI_PROJECT_DIR}/repos/Xyce/Xyce_Regression/Xyce_FastrackRegression"
      }
